# 模型与运行时资产台账
#
# 【纪律】
#   1. 状态字段只能来自实测。每个 PASS / FAIL 必须附实测依据与日期。
#   2. tag 用于调用，digest 用于身份固定。不要用 tag 代替 digest。
#   3. tag 里的数字不是参数量证据（MoE 的 tag 常标激活参数）。params 必须有来源。
#   4. acquisition（能不能拿到）与 gate（拿到后过没过门）是两套字段，永不混用。
#      `ollama pull` 失败记在 availability / reason，不记为任何 GATE failure。
#   4b. artifact_provenance 记录「这一份 artifact 的生成链是否已核实」。
#       `channel: ollama` 只证明本轮通过 Ollama 取得，【不能推出】GGUF 由谁转换 ——
#       Ollama 支持直接导入外部 GGUF。未核实即记 unverified。
#       GATE-2 的 PASS / FAIL 与 provenance 解耦：
#       failure 永远只对该 artifact 成立；要判断是否关于模型架构，
#       须换一个 provenance 已知的 artifact 复测。
#       仅当 artifact_provenance: verified 时，才可另加 source_trust 分级。
#   5. GATE-2 的 PASS / FAIL 只绑定「这一份 artifact + 这一版 runtime」，
#      不外推为该模型架构永久兼容或永久不兼容。
#   6. license_claim 是「某日在某来源看到的声明」，不是已核验状态。
#      gate3_license 一律 TODO，直到正式 GATE-3 执行。
#
# 【四道门】按顺序执行，任一不过即淘汰。性能只在全部过门者之间当 tie-breaker。
#   GATE-1 参数    总参数 ≤ 5B（MoE 按总参数计）
#   GATE-2 运行时  llama.cpp 可加载并跑出 bench
#   GATE-3 许可    商用可接受（需人工核官方来源）
#   GATE-4 多语种  排除性烟雾测试，判据为「回答是否使用提问所用的语言」
#
# 生成于 2026-09-07，S4a 实测结果于 2026-09-08 写入


# ==============================================================================
# 运行时作用域 —— GATE-2 结论的限定条件
# 复数键名：M3 / M6 会有新的 runtime，届时新增一个键即可，不改 schema
# ==============================================================================
runtime_scopes:
  rt-2026-09-08:
    llama_cpp: "0.4.0 build 10809 commit 5266f24da"
    ggml: "0.23.0"                 # 本机 Cellar 内另有 0.20.0；实测加载的是 0.23.0
    ollama: "0.33.3"
    os: "macOS 15.6 (24G84) arm64"
    hardware: "Mac Studio M3 Ultra, 96GB unified memory"
    bench_args: "-ngl 0 -t 8"
    cpu_only_verified: true
    cpu_only_evidence: |
      同一 artifact llama3.2:3b (dde5aa3f…) 三组对照，pp512 / pp1024 / pp1200：
        -ngl 0          117.05 / 107.17 / 101.87
        --device none   116.65 / 106.87 / 101.59
        -ngl 99        2554.33 / 2499.06 / 2440.03
      -ngl 99 的 pp1024 为 -ngl 0 的 23.3 倍 → 该旋钮在本 runtime 下确实能区分
      GPU 路径；因此 -ngl 0 与 --device none 的一致性构成「未 offload」的证据。
      注：三种方式启动时均加载并初始化 Metal backend，banner 均为 BLAS,MTL —— 
      backend 被加载/初始化本身不能证明发生了 GPU offload。
    scope_note: |
      ⚠️ 本条证明的是【无 GPU offload】，不是【这些数字适用于船端】。
      -ngl 0 路径仍包含 BLAS（Apple Accelerate）；船端 x86 无 Accelerate、
      也无 Apple 统一内存带宽。M0（2026-08-17）估算 x86 CPU 为 35–85 t/s，
      对比本机的 117 t/s。船端外推仍然乐观，原因是 Accelerate 与内存带宽，
      不是 Metal。


